name: Deploy site

# Reusable workflow: сборка в CI, загрузка .next на сервер, запуск scripts/github-deploy-remote.sh.
# Секреты берутся по префиксу (RU_*, EN_*, AE_*) через secrets: inherit.
on:
  workflow_call:
    inputs:
      name:
        description: 'Уникальное имя деплоя (имя архива сборки)'
        required: true
        type: string
      branch:
        description: 'Ветка сборки: main для прода, staging для стейджа'
        required: true
        type: string
      server:
        description: 'Префикс секретов сервера, БД и Payload: RU | EN | AE'
        required: true
        type: string
      site:
        description: 'Префикс секретов сайта (GTM, Replain, Calendly, URL, язык, PM2-имя): RU | EN | AE'
        required: true
        type: string
      project_name:
        type: string
        default: ''
      site_url:
        type: string
        default: ''
      lang:
        type: string
        default: ''
      port:
        type: string
        default: ''
      health_path:
        type: string
        default: ''
      staging:
        type: boolean
        default: false
      base_path:
        type: string
        default: ''
      media_base_url:
        type: string
        default: ''
      skip_db_maintenance:
        type: boolean
        default: false
      run_migrations:
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_NAME: ${{ inputs.project_name || secrets[format('{0}_PROJECT_NAME', inputs.site)] }}
      DEPLOY_BRANCH: ${{ inputs.branch }}
      PORT: ${{ inputs.port }}
      HEALTH_PATH: ${{ inputs.health_path }}
      SKIP_DATABASE_MAINTENANCE: ${{ inputs.skip_db_maintenance }}
      RUN_DATABASE_MIGRATIONS: ${{ inputs.run_migrations }}
      DATABASE_URI: ${{ secrets[format('{0}_DATABASE_URI', inputs.server)] }}
      PAYLOAD_SECRET: ${{ secrets[format('{0}_PAYLOAD_SECRET', inputs.server)] }}
      ADMIN_NOTIFY_EMAIL: ${{ secrets.ADMIN_NOTIFY_EMAIL }}
      UNISENDER_GO_API_KEY: ${{ secrets.UNISENDER_GO_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_TEST_RECIPIENT: ${{ secrets.EMAIL_TEST_RECIPIENT }}
      NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url || secrets[format('{0}_NEXT_PUBLIC_SITE_URL', inputs.site)] }}
      NEXT_PUBLIC_GTM_ID: ${{ secrets[format('{0}_NEXT_PUBLIC_GTM_ID', inputs.site)] }}
      NEXT_PUBLIC_LANG: ${{ inputs.lang || secrets[format('{0}_LANG', inputs.site)] }}
      NEXT_PUBLIC_REPLAIN_ID: ${{ secrets[format('{0}_NEXT_PUBLIC_REPLAIN_ID', inputs.site)] }}
      NEXT_PUBLIC_CALENDLY_URL: ${{ secrets[format('{0}_NEXT_PUBLIC_CALENDLY_URL', inputs.site)] }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_STAGING: ${{ inputs.staging }}
      NEXT_PUBLIC_BASE_PATH: ${{ inputs.base_path }}
      NEXT_PUBLIC_STAGING_EN_URL: ${{ inputs.staging && 'https://staging.8blocks.io' || '' }}
      NEXT_PUBLIC_STAGING_RU_URL: ${{ inputs.staging && 'https://staging.8blocks.io/ru' || '' }}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${{ inputs.media_base_url }}
      BUILD_ARCHIVE_NAME: next-build-${{ github.run_id }}-${{ inputs.name }}.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set build timestamp
        run: echo "NEXT_PUBLIC_BUILD_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Build ${{ inputs.name }}
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          npm ci --prefer-offline
          ./node_modules/.bin/cross-env NODE_ENV=production PAYLOAD_CONFIG_PATH=payload.config.ts node -r ./scripts/payload-next-env-shim.cjs -r tsx/cjs node_modules/payload/dist/bin/index.js generate:importmap || echo "Import map generation failed; using committed map"
          npm run build
          tar -czf "$BUILD_ARCHIVE_NAME" .next
      - name: Upload ${{ inputs.name }} build
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets[format('{0}_SSH_HOST', inputs.server)] }}
          username: ${{ secrets[format('{0}_SSH_USER', inputs.server)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', inputs.server)] }}
          port: ${{ secrets[format('{0}_SSH_PORT', inputs.server)] || 22 }}
          source: ${{ env.BUILD_ARCHIVE_NAME }}
          target: /tmp
      - name: Deploy ${{ inputs.name }} via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          BUILD_ARCHIVE: /tmp/${{ env.BUILD_ARCHIVE_NAME }}
        with:
          host: ${{ secrets[format('{0}_SSH_HOST', inputs.server)] }}
          username: ${{ secrets[format('{0}_SSH_USER', inputs.server)] }}
          key: ${{ secrets[format('{0}_SSH_KEY', inputs.server)] }}
          port: ${{ secrets[format('{0}_SSH_PORT', inputs.server)] || 22 }}
          command_timeout: 25m
          script_path: scripts/github-deploy-remote.sh
          envs: PROJECT_NAME,DEPLOY_BRANCH,PORT,HEALTH_PATH,SKIP_DATABASE_MAINTENANCE,RUN_DATABASE_MIGRATIONS,DATABASE_URI,PAYLOAD_SECRET,ADMIN_NOTIFY_EMAIL,UNISENDER_GO_API_KEY,RESEND_API_KEY,EMAIL_TEST_RECIPIENT,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_GTM_ID,NEXT_PUBLIC_LANG,NEXT_PUBLIC_REPLAIN_ID,NEXT_PUBLIC_CALENDLY_URL,NEXT_PUBLIC_POSTHOG_KEY,NEXT_PUBLIC_STAGING,NEXT_PUBLIC_BASE_PATH,NEXT_PUBLIC_STAGING_EN_URL,NEXT_PUBLIC_STAGING_RU_URL,NEXT_PUBLIC_MEDIA_BASE_URL,NEXT_PUBLIC_BUILD_AT,BUILD_ARCHIVE
