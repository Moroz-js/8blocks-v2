name: Deploy to Production

on:
  # Автодеплой при пуше в main отключён — только вручную
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target: all or a single site'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ru
          - en
          - ae
          - staging

# В matrix нельзя ссылаться на secrets — отдельные job для каждого билда.
jobs:
  deploy-ru:
    if: ${{ github.event.inputs.deploy_target == 'all' || github.event.inputs.deploy_target == 'ru' || github.event.inputs.deploy_target == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build RU application
        env:
          DATABASE_URI: ${{ secrets.RU_DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.RU_PAYLOAD_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.RU_NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.RU_NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_LANG: ${{ secrets.RU_LANG }}
          NEXT_PUBLIC_REPLAIN_ID: ${{ secrets.RU_NEXT_PUBLIC_REPLAIN_ID }}
          NEXT_PUBLIC_CALENDLY_URL: ${{ secrets.RU_NEXT_PUBLIC_CALENDLY_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          PUPPETEER_SKIP_DOWNLOAD: true
        run: |
          npm ci --prefer-offline
          ./node_modules/.bin/cross-env NODE_ENV=production PAYLOAD_CONFIG_PATH=payload.config.ts node -r ./scripts/payload-next-env-shim.cjs -r tsx/cjs node_modules/payload/dist/bin/index.js generate:importmap || echo "Import map generation failed; using committed map"
          npm run build
          tar -czf "next-build-${{ github.run_id }}-${{ github.job }}.tar.gz" .next
      - name: Upload RU build
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.RU_SSH_HOST }}
          username: ${{ secrets.RU_SSH_USER }}
          key: ${{ secrets.RU_SSH_KEY }}
          port: ${{ secrets.RU_SSH_PORT || 22 }}
          source: next-build-${{ github.run_id }}-${{ github.job }}.tar.gz
          target: /tmp
      - name: Deploy RU via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          PROJECT_NAME: ${{ secrets.RU_PROJECT_NAME }}
          DATABASE_URI: ${{ secrets.RU_DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.RU_PAYLOAD_SECRET }}
          ADMIN_EMAIL: ${{ secrets.RU_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.RU_ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.RU_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.RU_SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.RU_SMTP_SECURE }}
          SMTP_USER: ${{ secrets.RU_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.RU_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.RU_SMTP_FROM }}
          ADMIN_NOTIFY_EMAIL: ${{ secrets.ADMIN_NOTIFY_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.RU_NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.RU_NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_LANG: ${{ secrets.RU_LANG }}
          NEXT_PUBLIC_REPLAIN_ID: ${{ secrets.RU_NEXT_PUBLIC_REPLAIN_ID }}
          NEXT_PUBLIC_CALENDLY_URL: ${{ secrets.RU_NEXT_PUBLIC_CALENDLY_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          BUILD_ARCHIVE: /tmp/next-build-${{ github.run_id }}-${{ github.job }}.tar.gz
        with:
          host: ${{ secrets.RU_SSH_HOST }}
          username: ${{ secrets.RU_SSH_USER }}
          key: ${{ secrets.RU_SSH_KEY }}
          port: ${{ secrets.RU_SSH_PORT || 22 }}
          command_timeout: 25m
          script_path: scripts/github-deploy-remote.sh
          envs: PROJECT_NAME,DATABASE_URI,PAYLOAD_SECRET,ADMIN_EMAIL,ADMIN_PASSWORD,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,ADMIN_NOTIFY_EMAIL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_GTM_ID,NEXT_PUBLIC_LANG,NEXT_PUBLIC_REPLAIN_ID,NEXT_PUBLIC_CALENDLY_URL,NEXT_PUBLIC_POSTHOG_KEY,BUILD_ARCHIVE

