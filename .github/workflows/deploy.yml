name: Deploy to Production

# Прод (ru, en, ae) — вручную из main. Staging — автоматически после push/merge и вручную.
on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Target: all or a single site'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ru
          - en
          - ae
          - staging

# Не прерываем SSH-деплой и не запускаем параллельные обновления серверов.
concurrency:
  group: deploy-sites
  cancel-in-progress: false

jobs:
  deploy-ru:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'all' || inputs.deploy_target == 'ru' || inputs.deploy_target == '') }}
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
    with:
      name: ru
      branch: main
      server: RU
      site: RU

  deploy-en:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'all' || inputs.deploy_target == 'en' || inputs.deploy_target == '') }}
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
    with:
      name: en
      branch: main
      server: EN
      site: EN

  deploy-ae:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'all' || inputs.deploy_target == 'ae' || inputs.deploy_target == '') }}
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
    with:
      name: ae
      branch: main
      server: AE
      site: AE

  # Staging живёт на EN-сервере и использует EN-базу; RU-стейдж — под /ru.
  deploy-staging-en:
    needs: deploy-en
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.deploy_target == 'all' || inputs.deploy_target == 'staging' || inputs.deploy_target == '') && (needs['deploy-en'].result == 'success' || needs['deploy-en'].result == 'skipped') }}
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
    with:
      name: staging-en
      branch: staging
      ref: ${{ github.event_name == 'push' && github.sha || 'staging' }}
      server: EN
      site: EN
      project_name: 8blocks-staging-en
      site_url: https://staging.8blocks.io
      lang: en
      port: '3001'
      health_path: /
      staging: true
      skip_db_maintenance: true
      run_migrations: true

  deploy-staging-ru:
    needs: deploy-staging-en
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.deploy_target == 'all' || inputs.deploy_target == 'staging' || inputs.deploy_target == '') && needs['deploy-staging-en'].result == 'success' }}
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
    with:
      name: staging-ru
      branch: staging
      ref: ${{ github.event_name == 'push' && github.sha || 'staging' }}
      server: EN
      site: RU
      project_name: 8blocks-staging-ru
      site_url: https://staging.8blocks.io/ru
      lang: ru
      port: '3002'
      health_path: /ru
      staging: true
      base_path: /ru
      media_base_url: https://staging.8blocks.io
      skip_db_maintenance: true
      run_migrations: true
